<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mendesky Design System</title>
  <script>
    // 網站根目錄：轉到最新有完整文件的正式版；還沒有時轉到 main（只有 README 的舊版 legacy 不算）
    fetch('versions.json', { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : []; })
      .catch(function () { return []; })
      .then(function (list) {
        var latest = list.filter(function (v) { return !v.legacy; })[0];
        location.replace((latest ? latest.version : 'main') + '/');
      });
  </script>
</head>
<body>
  <p>正在前往文件……若沒有自動跳轉，請開啟 <a href="main/">最新文件</a>。</p>
</body>
</html>

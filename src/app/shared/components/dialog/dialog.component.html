<div *ngIf="visible()" class="dialog-overlay" [class.dialog-overlay--leaving]="isClosing()" (click)="$event.stopPropagation()">
  <!-- Backdrop -->
  <div class="dialog-backdrop" [class.dialog-backdrop--leaving]="isClosing()"></div>

  <!-- Dialog Card -->
  <div class="dialog-card" [class.dialog-card--leaving]="isClosing()"
       role="dialog" aria-modal="true"
       cdkTrapFocus [cdkTrapFocusAutoCapture]="true">
    <div class="dialog-wrapper">

      <!-- Header Section -->
      <div class="dialog-header-section">
        <!-- Icon + Title -->
        <div class="dialog-header-row">
          <span class="dialog-header-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
              <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.5"/>
              <path d="M12 8.5v1.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              <path d="M12 12.5v4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </span>
          <span class="dialog-header-title">{{ header }}</span>
        </div>

        <!-- Divider -->
        <div class="dialog-divider"></div>
      </div>

      <!-- Content Text -->
      <div class="dialog-content">{{ content }}</div>

      <!-- Action Buttons -->
      <div class="dialog-actions">
        <!-- Cancel Button -->
        <app-button *ngIf="showCancel"
                    variant="elevated"
                    [text]="cancelText"
                    [fullWidth]="true"
                    style="flex: 1;"
                    (btnClick)="onCancel()">
        </app-button>

        <!-- Warning: danger confirm button -->
        <app-button *ngIf="propClass === 'Warning'"
                    [text]="confirmText"
                    variant="filled"
                    color="danger"
                    [leftIcon]="confirmIcon"
                    [fullWidth]="true"
                    [loading]="loading"
                    style="flex: 1;"
                    (btnClick)="onConfirm()">
        </app-button>

        <!-- Normal: primary confirm button -->
        <app-button *ngIf="propClass === 'Normal'"
                    [text]="confirmText"
                    variant="filled"
                    color="primary"
                    [fullWidth]="true"
                    [loading]="loading"
                    style="flex: 1;"
                    (btnClick)="onConfirm()">
        </app-button>
      </div>

    </div>
  </div>
</div>

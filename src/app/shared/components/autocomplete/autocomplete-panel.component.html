<div class="autocomplete-panel">
  <ng-container *ngIf="options.length > 0; else noResult">
    <button
      #optionEl
      *ngFor="let opt of options; let i = index"
      class="autocomplete-option"
      [class.autocomplete-option--active]="i === activeIndex"
      type="button"
      (mousedown)="$event.preventDefault()"
      (click)="select(opt)"
    >
      {{ opt.label }}
    </button>
  </ng-container>
  <ng-template #noResult>
    <div class="autocomplete-no-result">無符合結果</div>
  </ng-template>
</div>

<div class="label" [ngClass]="hostClasses">

  <!-- Left Icon：leftIconName 設定時用 app-icon（registry），否則內建 Done-OK 打勾 -->
  <span *ngIf="showLeftIcon || leftIconName" class="label__icon" [ngClass]="iconColorClass">
    <app-icon *ngIf="leftIconName; else builtinCheck" [name]="leftIconName" size="16"></app-icon>
    <ng-template #builtinCheck>
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <path d="M2.5 8.5L5.5 12L13.5 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </ng-template>
  </span>

  <!-- Numbered List Badge -->
  <div *ngIf="showNumberedList" class="label__number-badge">01</div>

  <!-- Text -->
  <span class="label__text" [ngClass]="textClass">{{ text }}</span>

  <!-- Right Icon (More dots) -->
  <span *ngIf="showRightIcon" class="label__icon" [ngClass]="iconColorClass">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
      <circle cx="4" cy="8" r="1.3" fill="currentColor"/>
      <circle cx="8" cy="8" r="1.3" fill="currentColor"/>
      <circle cx="12" cy="8" r="1.3" fill="currentColor"/>
    </svg>
  </span>
</div>

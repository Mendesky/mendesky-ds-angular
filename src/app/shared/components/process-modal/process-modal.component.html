<div class="process-modal-overlay"
     *ngIf="visible()"
     [class.process-modal-overlay--leaving]="isClosing()"
     (click)="onBackdropClick()">
  <div class="process-modal-card"
       [class.process-modal-card--running]="type === 'running'"
       [class.process-modal-card--congratulation]="type === 'congratulation'"
       [class.process-modal-card--leaving]="isClosing()"
       (click)="$event.stopPropagation()">

    <!-- Running -->
    <ng-container *ngIf="type === 'running'">
      <span class="process-modal__icon">
        <app-spinner size="36" [decorative]="true"></app-spinner>
      </span>
      <span class="process-modal__text process-modal__text--dark" role="status">
        {{ message || '執行中請稍候' }}
      </span>
    </ng-container>

    <!-- Congratulation -->
    <ng-container *ngIf="type === 'congratulation'">
      <span class="confetti confetti--1"></span>
      <span class="confetti confetti--2"></span>
      <span class="confetti confetti--3"></span>
      <span class="confetti confetti--4"></span>
      <span class="confetti confetti--5"></span>
      <span class="confetti confetti--6"></span>
      <span class="confetti confetti--7"></span>
      <span class="confetti confetti--8"></span>
      <span class="process-modal__text process-modal__text--light process-modal__text--center">
        {{ message || '恭喜！' }}
      </span>
    </ng-container>

  </div>
</div>

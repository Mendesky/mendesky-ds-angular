<div
  class="upload-dropzone"
  [class.upload-dropzone--disabled]="disabled"
  [class.upload-dropzone--error]="!!errorMessage"
  [class.upload-dropzone--drag-over]="isDragOver()"
  [attr.tabindex]="disabled ? null : '0'"
  [attr.role]="disabled ? null : 'button'"
  [attr.aria-label]="disabled ? null : '點擊或拖曳上傳文件'"
  [appErrorTooltip]="errorMessage"
  [errorPosition]="errorPosition"
  (dragover)="onDragOver($event)"
  (dragenter)="onDragEnter($event)"
  (dragleave)="onDragLeave()"
  (drop)="onDrop($event)"
  (click)="onZoneClick(fileInput)"
  (keydown)="onKeydown($event, fileInput)">

  <!-- ── 文字說明 ── -->
  @if (disabled && disabledHint) {
    <p class="upload-dropzone__hint-text">{{ disabledHint }}</p>
  } @else {
    <p class="upload-dropzone__main-text">拖曳檔案至此，或點擊選擇檔案</p>
    <p class="upload-dropzone__sub-text">
      限制 {{ maxSize }}MB{{ typeDisplayText ? ' · ' + typeDisplayText : '' }}
    </p>
  }

  <!-- 隱藏的 file input -->
  <input
    #fileInput
    type="file"
    multiple
    hidden
    [attr.accept]="acceptString || null"
    (change)="onFileInputChange($event)">
</div>

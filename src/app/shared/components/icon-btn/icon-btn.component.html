<div class="icon-btn-wrap"
     [class.icon-btn-wrap--icon-text]="propClass === 'Icon+Text'"
     [class.icon-btn-wrap--loading]="busy"
     [appTooltip]="displayTooltip"
     [appTooltipDirection]="resolvedTooltipDir"
     (click)="onWrapClick($event)">
  <button
    class="icon-btn"
    [ngClass]="hostClasses"
    [disabled]="disabled"
    [attr.aria-label]="ariaLabel || null"
    [attr.aria-busy]="busy ? 'true' : null"
    [attr.aria-disabled]="busy ? 'true' : null"
    [attr.aria-pressed]="toggle ? (active ? 'true' : 'false') : null"
    [attr.aria-haspopup]="ariaHaspopup"
    [attr.aria-expanded]="ariaExpanded"
    type="button"
    (click)="onClick()"
  >
    <span class="icon-btn__icon-wrap">
      <span class="icon-btn__content" [class.icon-btn__content--hidden]="busy"><ng-content></ng-content></span>
      @if (busy) {
        <app-spinner class="icon-btn__spinner" [size]="spinnerSize" [decorative]="true"></app-spinner>
      }
    </span>
    <span *ngIf="label" class="icon-btn__label">{{ label }}</span>
  </button>
  <!-- 報讀用：放在按鈕外面（按鈕裡的內容只會被當成按鈕名稱），一直存在，載入中才填字 -->
  @if (loadingLabel) {
    <span class="icon-btn__sr" role="status">{{ busy ? loadingLabel : '' }}</span>
  }
</div>

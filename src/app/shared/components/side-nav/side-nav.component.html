<ng-content select="[sideNavHeader]"></ng-content>
<nav class="side-nav__nav" [attr.aria-label]="ariaLabel">
  @for (group of groups; track group.id; let gi = $index) {
    @if (layout === 'rail' && gi > 0) {
      <span class="side-nav__sep" aria-hidden="true"></span>
    }
    <div
      class="side-nav__group"
      [attr.role]="group.heading ? 'group' : null"
      [attr.aria-labelledby]="layout === 'expanded' && group.heading ? headingId(gi) : null"
      [attr.aria-label]="layout === 'rail' && group.heading ? group.heading : null">
      @if (layout === 'expanded' && group.heading) {
        <div class="side-nav__heading" [id]="headingId(gi)">{{ group.heading }}</div>
      }
      @for (item of group.items; track item.id) {
        <a
          class="side-nav__item"
          [class.side-nav__item--current]="item.id === currentId"
          [href]="item.href"
          [attr.aria-current]="item.id === currentId ? 'page' : null"
          [attr.aria-label]="layout === 'rail' ? item.label : null"
          [appTooltip]="mode === 'rail' ? item.label : ''"
          appTooltipDirection="right"
          (click)="onItemClick($event, item)">
          <app-icon [name]="item.icon" [size]="layout === 'expanded' ? '20' : '24'"></app-icon>
          @if (layout === 'expanded') {
            <span class="side-nav__label">{{ item.label }}</span>
          }
        </a>
      }
    </div>
  }
</nav>

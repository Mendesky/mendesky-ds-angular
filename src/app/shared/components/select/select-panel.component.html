<div class="panel">
  <div class="panel-scroll">
    <button
      #optionEl
      class="panel-option"
      *ngFor="let opt of options; let i = index"
      type="button"
      [class.panel-option--disabled]="opt.disabled"
      [class.panel-option--active]="i === activeIndex"
      [disabled]="opt.disabled"
      (mousedown)="$event.preventDefault()"
      (click)="select(opt)">
      @if (opt.status) {
        <span class="panel-option__label">{{ opt.label }}</span>
        <span class="panel-status" aria-hidden="true" [appTooltip]="opt.status.label">
          <app-icon name="Alert-Info" size="16"></app-icon>
        </span>
        <!-- 看不見，報讀軟體接在名稱後面念 -->
        <span class="panel-sr">，{{ opt.status.label }}</span>
      } @else {
        {{ opt.label }}
      }
    </button>

    <div class="panel-empty" *ngIf="options.length === 0">
      無符合結果
    </div>
  </div>

  <!-- inset border -->
  <div class="panel-inset-border"></div>
</div>

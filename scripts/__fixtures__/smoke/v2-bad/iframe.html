<!doctype html>
<html><head><meta charset="utf-8"></head>
<body>
<div id="storybook-root"></div><div id="storybook-docs"></div>
<script>
  // 模擬畫錯的說明頁（data-ds-id="demo"）：部位少畫一項（規格 2 項、只畫 1 項）；
  // 可以這樣做連到 demo--full-width，但範例網站（index.json）沒有這個範例；不要這樣做留下沒換掉的 #button。其他區塊都對
  setTimeout(() => {
    const el = document.createElement('div');
    el.className = 'sbdocs';
    el.innerHTML =
      '<div class="ds-doc" data-ds-id="demo">' +
      '<h2 data-testid="ds-doc-anatomy">部位</h2><ol>' +
      '<li data-testid="ds-doc-anatomy-item"><strong>外框</strong>：可以點的範圍</li></ol>' +
      '<h2 data-testid="ds-doc-states">狀態</h2><table><tbody>' +
      '<tr data-testid="ds-doc-state-item"><td>停用</td><td>灰底灰字</td></tr></tbody></table>' +
      '<h2 data-testid="ds-doc-dodont">可以這樣做、不要這樣做</h2>' +
      '<ul><li data-testid="ds-doc-do-item">需要撐滿寬度時用 fullWidth <a href="./?path=/story/demo--full-width" data-story-id="demo--full-width">看範例</a></li></ul>' +
      '<ul><li data-testid="ds-doc-dont-item">不要在裡面放另一個可以點的東西，例如 #button</li></ul>' +
      '<h2 data-testid="ds-doc-example">範例</h2>' +
      '<h2 data-testid="ds-doc-a11y">無障礙</h2>' +
      '<h3>網頁和 APP 都要做到</h3><dl class="ds-doc-a11y"><dt class="ds-doc-a11y__label">鍵盤</dt>' +
      '<dd><ul><li data-testid="ds-doc-a11y-item">Tab 移到元件</li></ul></dd></dl>' +
      '<h3>網頁專屬</h3><dl class="ds-doc-a11y"><dt class="ds-doc-a11y__label">ARIA 與 HTML 語意</dt>' +
      '<dd><ul><li data-testid="ds-doc-a11y-item">用原生 button 元素</li></ul></dd></dl>' +
      '</div>';
    document.getElementById('storybook-docs').appendChild(el);
  }, 50);
</script>
</body></html>

<!doctype html>
<html><head><meta charset="utf-8"></head>
<body>
<div id="storybook-root"></div><div id="storybook-docs"></div>
<script>
  // 模擬範例網站只有範例、一個說明頁都沒有（index.json 沒有 docs 項目）：範例照常畫出
  const params = new URLSearchParams(location.search);
  setTimeout(() => {
    const el = document.createElement('div');
    el.textContent = '畫出 ' + params.get('id');
    document.getElementById('storybook-root').appendChild(el);
  }, 50);
</script>
</body></html>

name: Docs

# main 有新 commit 時，重建 Angular 版的範例網站（Storybook），發布到 gh-pages 的 /main/components/。
# 設計系統的文件網站在本體 repo（mendesky-ds）：它連到這裡的元件說明頁、嵌入這裡的範例。
# 根目錄轉到本體的文件網站；v0.2.0 以前的完整文件保留在各版本資料夾。
# PR 不發布；PR 的建置檢查在 CI 的 smoke job。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: 發布 main 的範例網站
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: bash scripts/build-storybook-site.sh storybook-static
      - name: 推到 gh-pages（只換 main/components 與根目錄轉址頁）
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/publish-pages.sh storybook-static main/components

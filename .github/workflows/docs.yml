name: Docs

# main 有新 commit 時，重建文件網站並發布到 gh-pages 分支（GitHub Pages 的來源）：
#   /            首頁（docs-site/）
#   /latest/     main 的最新內容
#   /<版本>/      每個正式版的文件（由自動打版流程發布，這裡不動）
# PR 不發布；PR 的建置檢查在 CI 的 smoke job。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: 發布 latest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build-storybook
      - name: 推到 gh-pages（只換首頁與 latest，保留各版本資料夾）
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/publish-pages.sh storybook-static latest

name: Docs

# main 有新 commit 時，重建 main 版的文件網站並發布到 gh-pages 分支（GitHub Pages 的來源）：
#   /                    轉到最新正式版（還沒有正式版時轉到 main）
#   /main/               main 的指南（VitePress），/main/components/ 是元件頁（Storybook）
#   /<版本>/              每個正式版各自一整套文件（由打版流程發布，這裡不動）
# PR 不發布；PR 的建置檢查在 CI 的 smoke job。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: 發布 main
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: bash scripts/build-site.sh main
      - name: 推到 gh-pages（只換 main 資料夾與根目錄轉址頁，保留各版本資料夾）
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/publish-pages.sh site/.vitepress/dist main
